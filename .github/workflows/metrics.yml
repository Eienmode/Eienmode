name: Update language & habit metrics

# Analyzes your actual commits (public AND private repos) to show which
# languages you use most and which you've used recently, plus coding habits.
# Needs a repo secret named METRICS_TOKEN (a GitHub personal access token).
# Until that secret exists, this workflow skips itself instead of failing.

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Languages (most used + recently used)
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: Asia/Singapore
          template: classic
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 400
          plugin_languages_colors: github
          extras_css: "h2 { color: #ff4f8b !important; } h2 svg { fill: #ff4f8b !important; }"

      - name: Coding habits
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.habits.svg
          base: ""
          config_timezone: Asia/Singapore
          template: classic
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: no
          extras_css: "h2 { color: #ff4f8b !important; } h2 svg { fill: #ff4f8b !important; }"
