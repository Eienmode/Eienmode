name: Update stat cards

# Draws cards/stats.svg, cards/languages.svg and cards/activity.svg from your
# GitHub data (public + private repos) using the METRICS_TOKEN secret.
# Also draws cards/contributions.svg (full-year contribution calendar).

on:
  schedule:
    - cron: "17 * * * *" # every hour (at :17, when GitHub's queue is less busy)
  workflow_dispatch:
  push:
    branches: [main] # every push you make (the bot's own commits don't re-trigger it)

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update stat cards"
          git pull --rebase
          git push
